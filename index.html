html<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyeryung Kim | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🖼️ 첫 화면 가로 바둑판 사진 목록 (WORK 글씨 삭제 완료) -->
<div class="gallery">
    <div class="gallery-item" onclick="openLightbox('images/001.jpg')">
        <img src="images/001.jpg" alt="작품 1">
    </div>
    <div class="gallery-item" onclick="openLightbox('images/002.jpg')">
        <img src="images/002.jpg" alt="작품 2">
    </div>
    <div class="gallery-item" onclick="openLightbox('images/003.jpg')">
        <img src="images/003.jpg" alt="작품 3">
    </div>
</div>

<!-- 🖤 클릭 시 모니터 한눈에 쏙 들어오는 아담한 검은색 팝업창 -->
<div id="custom-lightbox" class="custom-lightbox" onclick="closeLightbox()">
    <span class="custom-close-btn">&times;</span>
    <img id="custom-lightbox-img" src="" alt="확대 사진">
</div>

<!-- 외부 프로그램 없이 완벽하게 작동하는 초간단 실행 스크립트 -->
<script>
    function openLightbox(imgSrc) {
        document.getElementById('custom-lightbox-img').src = imgSrc;
        document.getElementById('custom-lightbox').style.display = 'flex';
        document.body.style.overflow = 'hidden'; /* 팝업 떴을 때 배경 스크롤바 차단 */
    }
    function closeLightbox() {
        document.getElementById('custom-lightbox').style.display = 'none';
        document.body.style.overflow = 'auto'; /* 팝업 닫으면 스크롤바 복구 */
    }
</script>

</body>
</html>
<script src="script.js"></script>

</body>
</html>
