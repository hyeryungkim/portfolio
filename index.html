<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyeryung Kim | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 🖤 완벽 차단용 검은색 팝업창 레이아웃 */
        .custom-lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.98);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* 🖼️ 모니터 가득 시원하게 꽉 차는 큰 사진 공간 */
        .lightbox-wrapper {
            position: relative;
            max-width: 85vw;
            max-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .custom-lightbox img {
            max-width: 85vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* 🔍 상단 툴바 (확대 및 닫기 버튼 배치) */
        .lightbox-toolbar {
            position: absolute;
            top: 25px;
            right: 35px;
            display: flex;
            align-items: center;
            gap: 25px;
            z-index: 1000002;
        }

        .toolbar-btn {
            color: #ffffff !important;
            font-size: 36px !important;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toolbar-btn:hover {
            opacity: 1;
        }

        /* 🔍 세련된 SVG 아이콘 공통 전용 스타일 */
        .svg-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ◀ ▶ 세련된 동그라미 고정형 이동 화살표 버튼 */
        .nav-btn {
            position: absolute !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            cursor: pointer !important;
            width: 60px !important;            /* 👈 화살표 상자 크기 고정 */
            height: 60px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            opacity: 0.7 !important;           /* 👈 선명하게 기본 배치 */
            z-index: 1000001 !important;       /* 👈 이미지 위로 강제 배치 */
            background-color: rgba(255, 255, 255, 0.1) !important; /* 은은한 흰색 동그라미 배경 */
            border-radius: 50% !important;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            opacity: 1 !important;
            background-color: rgba(255, 255, 255, 0.25) !important;
        }
        .prev-btn { left: 40px !important; }
        .next-btn { right: 40px !important; }

        /* 화살표 모양 굵기 및 크기 조절 */
        .nav-icon {
            width: 28px;
            height: 28px;
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

<!-- 🖼️ 첫 화면 가로 바둑판 사진 목록 -->
<div class="gallery">
    <div class="gallery-item" onclick="openLightbox(0)">
        <img src="images/001.jpg" alt="작품 1">
    </div>
    <div class="gallery-item" onclick="openLightbox(1)">
        <img src="images/002.jpg" alt="작품 2">
    </div>
    <div class="gallery-item" onclick="openLightbox(2)">
        <img src="images/003.jpg" alt="작품 3">
    </div>
</div>

<!-- 🖤 완벽하게 조종되는 팝업창 및 버튼 영역 -->
<div id="custom-lightbox" class="custom-lightbox">
    <!-- 상단 우측 버튼들 (돋보기, 닫기) -->
    <div class="lightbox-toolbar">
        <span class="toolbar-btn" onclick="toggleZoom(event)" id="zoom-btn" title="확대/축소">
            <svg class="svg-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </span>
        <span class="toolbar-btn" onclick="closeLightbox()" title="닫기">&times;</span>
    </div>

    <!-- ◀ 왼쪽 화살표 버튼 (SVG 고해상도 디자인으로 변경 완료) -->
    <span class="nav-btn prev-btn" onclick="changeImage(-1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </span>

    <!-- ▶ 오른쪽 화살표 버튼 (SVG 고해상도 디자인으로 변경 완료) -->
    <span class="nav-btn next-btn" onclick="changeImage(1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </span>

    <!-- 큰 사진 몸체 -->
    <div id="lightbox-wrapper" class="lightbox-wrapper">
        <img id="custom-lightbox-img" src="" alt="확대 사진" onclick="event.stopPropagation();">
    </div>
</div>

<!-- 화살표 이동 및 돋보기 무오류 순수 스크립트 -->
<script>
    const images = ['images/001.jpg', 'images/002.jpg', 'images/003.jpg'];
    let currentIndex = 0;
    let isZoomed = false;

    function openLightbox(index) {
        currentIndex = index;
        isZoomed = false;
        updateLightbox();
        document.getElementById('custom-lightbox').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('custom-lightbox').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function updateLightbox() {
        const wrapper = document.getElementById('lightbox-wrapper');
        document.getElementById('custom-lightbox-img').src = images[currentIndex];
        wrapper.style.transform = 'scale(1)';
        isZoomed = false;
    }

    function changeImage(direction, event) {
        event.stopPropagation();
        currentIndex += direction;
        if (currentIndex >= images.length) currentIndex = 0; 
        if (currentIndex < 0) currentIndex = images.length - 1; 
        updateLightbox();
    }

    function toggleZoom(event) {
        event.stopPropagation();
        const wrapper = document.getElementById('lightbox-wrapper');
        const lightbox = document.getElementById('custom-lightbox');
        if (!isZoomed) {
            wrapper.style.transform = 'scale(1.4)'; 
            lightbox.style.overflow = 'auto'; 
            isZoomed = true;
        } else {
            wrapper.style.transform = 'scale(1)';
            lightbox.style.overflow = 'hidden';
            isZoomed = false;
        }
    }

    document.addEventListener('keydown', function(e) {
        if (document.getElementById('custom-lightbox').style.display === 'flex') {
            if (e.key === 'ArrowRight') {
                currentIndex += 1;
                if (currentIndex >= images.length) currentIndex = 0;
                updateLightbox();
            }
            if (e.key === 'ArrowLeft') {
                currentIndex -= 1;
                if (currentIndex < 0) currentIndex = images.length - 1;
                updateLightbox();
            }
            if (e.key === 'Escape') closeLightbox();
        }
    });

    document.getElementById('custom-lightbox').addEventListener('click', function(e) {
        if (e.target === this || e.target === document.getElementById('lightbox-wrapper')) {
            closeLightbox();
        }
    });
</script>

</body>
