<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyeryung Kim | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 🖤 완벽 차단용 검은색 팝업창 레이아웃 */
        .custom-lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.98);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* 🖼️ 모니터 가득 시원하게 꽉 차는 큰 사진 공간 */
        .lightbox-wrapper {
            position: relative;
            max-width: 85vw;
            max-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .custom-lightbox img {
            max-width: 85vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* 🔍 상단 툴바 (확대 및 닫기 버튼 배치) */
        .lightbox-toolbar {
            position: absolute;
            top: 25px;
            right: 35px;
            display: flex;
            align-items: center;
            gap: 25px;
            z-index: 1000002;
        }

        .toolbar-btn {
            color: #ffffff !important;
            font-size: 36px !important;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toolbar-btn:hover {
            opacity: 1;
        }

        /* 🔍 세련된 SVG 아이콘 전용 스타일 */
        .svg-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ◀ ▶ 동그라미 없는 날렵한 화살표 */
        .nav-btn {
            position: absolute !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            cursor: pointer !important;
            width: 50px !important;
            height: 80px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            opacity: 0.4 !important;
            z-index: 1000001 !important;
            background-color: transparent !important;
            border: none !important;
            transition: opacity 0.2s ease !important;
        }
        .nav-btn:hover { opacity: 1 !important; }
        .prev-btn { left: 30px !important; }
        .next-btn { right: 30px !important; }

        .nav-icon {
            width: 40px;
            height: 40px;
            stroke: #ffffff;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 로딩 메시지 스타일 */
        .loader {
            color: #4a4949;
            font-size: 14px;
            text-align: center;
            margin-top: 50px;
            font-weight: 300;
        }
    </style>
</head>
<body>

<!-- 🖼 *진짜 자동화* 사진이 스스로 렌더링될 바둑판 영역 -->
<div id="gallery" class="gallery">
    <div id="gallery-loader" class="loader">작품 목록을 불러오는 중입니다...</div>
</div>

<!-- 🖤 팝업창 및 버튼 영역 -->
<div id="custom-lightbox" class="custom-lightbox">
    <div class="lightbox-toolbar">
        <span class="toolbar-btn" onclick="toggleZoom(event)" id="zoom-btn" title="확대/축소">
            <svg class="svg-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </span>
        <span class="toolbar-btn" onclick="closeLightbox()" title="닫기">&times;</span>
    </div>

    <span class="nav-btn prev-btn" onclick="changeImage(-1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </span>

    <span class="nav-btn next-btn" onclick="changeImage(1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </span>

    <div id="lightbox-wrapper" class="lightbox-wrapper">
        <img id="custom-lightbox-img" src="" alt="확대 사진" onclick="event.stopPropagation();">
    </div>
</div>

<!-- ⚙️ 자동화 시스템 스크립트 결합 -->
<script src="script.js"></script>
<script>
    let currentIndex = 0;
    let isZoomed = false;

    // 📁 script.js에 수집된 실제 이미지 주소들을 화면에 바둑판으로 렌더링
    function initGallery() {
        const galleryContainer = document.getElementById('gallery');
        const loader = document.getElementById('gallery-loader');
        if (loader) loader.remove();

        if (!images || images.length === 0) {
            galleryContainer.innerHTML = '<div class="loader">images 폴더에 등록된 사진이 없습니다.</div>';
            return;
        }

        images.forEach((src, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'gallery-item';
            itemDiv.setAttribute('onclick', `openLightbox(${index})`);
            
            const imgTag = document.createElement('img');
            imgTag.src = src;
            imgTag.alt = `작품 ${index + 1}`;
            
            itemDiv.appendChild(imgTag);
            galleryContainer.appendChild(itemDiv);
        });
    }

    function openLightbox(index) {
        currentIndex = index;
        isZoomed = false;
        updateLightbox();
        document.getElementById('custom-lightbox').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('custom-lightbox').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function updateLightbox() {
        const wrapper = document.getElementById('lightbox-wrapper');
        document.getElementById('custom-lightbox-img').src = images[currentIndex];
        wrapper.style.transform = 'scale(1)';
        isZoomed = false;
    }

    function changeImage(direction, event) {
        if (event) event.stopPropagation();
        currentIndex += direction;
        if (currentIndex >= images.length) currentIndex = 0; 
        if (currentIndex < 0) images.length - 1; 
        if (images.length > 0 && currentIndex < 0) currentIndex = images.length - 1;
        updateLightbox();
    }

    function toggleZoom(event) {
        if (event) event.stopPropagation();
        const wrapper = document.getElementById('lightbox-wrapper');
        const lightbox = document.getElementById('custom-lightbox');
        if (!isZoomed) {
            wrapper.style.transform = 'scale(1.4)'; 
            lightbox.style.overflow = 'auto'; 
            isZoomed = true;
        } else {
            wrapper.style.transform = 'scale(1)';
            lightbox.style.overflow = 'hidden';
            isZoomed = false;
        }
    }

    document.addEventListener('keydown', function(e) {
        if (document.getElementById('custom-lightbox').style.display === 'flex') {
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'Escape') closeLightbox();
        }
    });

    document.getElementById('custom-lightbox').addEventListener('click', function(e) {
        if (e.target === this || e.target === document.getElementById('lightbox-wrapper')) {
            closeLightbox();
        }
    });

    // 🚀 데이터 로드가 끝나면 화면 구성 시작
    if (typeof imagesReady !== 'undefined') {
        initGallery();
    } else {
        document.addEventListener('ImagesLoaded', initGallery);
    }
</script>

</body>
</html>
