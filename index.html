<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyeryung Kim | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 첫 화면 사진 목록 정렬 */
        .gallery {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important;
            gap: 40px !important; /* 글씨 공간을 위해 간격을 조금 넓힘 */
            max-width: 1200px !important;
            margin: 0 auto !important;
            padding: 20px 0 !important;
        }

        /* 개별 사진+텍스트 카드 세트 */
        .gallery-container {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            text-align: center !important;
        }

        .gallery-item {
            cursor: pointer !important;
            width: 280px !important;
            height: 280px !important;
            overflow: hidden !important;
            border-radius: 4px !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06) !important;
            transition: transform 0.2s ease;
            margin-bottom: 15px !important; /* 사진과 글씨 사이 간격 */
        }

        .gallery-item:hover {
            transform: translateY(-4px) !important;
        }

        .gallery-item img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }

        /* ✍️ [요청 반영] 사진 밑 제목 (얇은 두께, 색상, 가운데 정렬, 아담한 크기) */
        .item-title {
            font-size: 14px !important;
            font-weight: 600 !important;
            color: #4a4949 !important;
            margin: 0 0 6px 0 !important;
            letter-spacing: 0.5px !important;
            font-family: "Noto Serif Oriya", serif !important; /* 👈 폰트 변경 (원하는 글꼴 이름 입력) */
        }

        /* ✍️ [요청 반영] 사진 밑 설명글 (회색빛 색상, 가운데 정렬, 더 아담한 크기) */
        .item-desc {
            font-size: 11px !important;
            font-weight: 500 !important;
            color: #4a4949 !important;
            line-height: 1.5 !important;
            margin: 0 !important;
            white-space: pre-line !important;
            font-family: "Noto Serif Oriya", serif !important; /* 👈 폰트 변경 (원하는 글꼴 이름 입력) */
        }

        /* 🖤 완벽 차단용 검은색 팝업창 레이아웃 */
        .custom-lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.98);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* 🖼️ 모니터 가득 시원하게 꽉 차는 큰 사진 공간 */
        .lightbox-wrapper {
            position: relative;
            max-width: 85vw;
            max-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .custom-lightbox img {
            max-width: 85vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* 🔍 상단 툴바 (확대 및 닫기 버튼 배치) */
        .lightbox-toolbar {
            position: absolute;
            top: 25px;
            right: 35px;
            display: flex;
            align-items: center;
            gap: 25px;
            z-index: 1000002;
        }

        .toolbar-btn {
            color: #ffffff !important;
            font-size: 36px !important;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toolbar-btn:hover { opacity: 1 !important; }

        .svg-icon {
            width: 24px; height: 24px;
            fill: none; stroke: #ffffff; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ◀ ▶ 동그라미 없는 날렵한 화살표 */
        .nav-btn {
            position: absolute !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            cursor: pointer !important;
            width: 50px !important;
            height: 80px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            opacity: 0.4 !important;
            z-index: 1000001 !important;
            background-color: transparent !important;
            border: none !important;
            transition: opacity 0.2s ease !important;
        }
        .nav-btn:hover { opacity: 1 !important; }
        .prev-btn { left: 30px !important; }
        .next-btn { right: 30px !important; }

        .nav-icon {
            width: 40px; height: 40px;
            stroke: #ffffff; stroke-width: 1.5; fill: none;
            stroke-linecap: round; stroke-linejoin: round;
        }
    </style>
</head>
<body>

<!-- 🖼️ 자바스크립트가 알아서 채워줄 갤러리 영역 -->
<div id="gallery" class="gallery"></div>

<!-- 🖤 팝업창 및 버튼 영역 -->
<div id="custom-lightbox" class="custom-lightbox">
    <div class="lightbox-toolbar">
        <span class="toolbar-btn" onclick="toggleZoom(event)" id="zoom-btn" title="확대/축소">
            <svg class="svg-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </span>
        <span class="toolbar-btn" onclick="closeLightbox()" title="닫기">&times;</span>
    </div>

    <span class="nav-btn prev-btn" onclick="changeImage(-1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </span>

    <span class="nav-btn next-btn" onclick="changeImage(1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </span>

    <div id="lightbox-wrapper" class="lightbox-wrapper">
        <img id="custom-lightbox-img" src="" alt="확대 사진" onclick="event.stopPropagation();">
    </div>
</div>

<!-- ⚙️ 동적 생성 스크립트 -->
<script src="script.js"></script>
<script>
    let currentIndex = 0;
    let isZoomed = false;

    function initGallery() {
        const galleryContainer = document.getElementById('gallery');
        galleryContainer.innerHTML = '';

        // script.js의 데이터를 바탕으로 사진 상자 + 텍스트 상자 세트를 자동 조립
        galleryData.forEach((item, index) => {
            const containerDiv = document.createElement('div');
            containerDiv.className = 'gallery-container';

            const itemDiv = document.createElement('div');
            itemDiv.className = 'gallery-item';
            itemDiv.setAttribute('onclick', `openLightbox(${index})`);
            
            const imgTag = document.createElement('img');
            imgTag.src = item.src;
            imgTag.alt = item.title;
            
            itemDiv.appendChild(imgTag);
            containerDiv.appendChild(itemDiv);

            // 제목 추가
            const titleH3 = document.createElement('h3');
            titleH3.className = 'item-title';
            titleH3.innerText = item.title;
            containerDiv.appendChild(titleH3);

            // 설명글 추가
            const descP = document.createElement('p');
            descP.className = 'item-desc';
            descP.innerText = item.desc;
            containerDiv.appendChild(descP);

            galleryContainer.appendChild(containerDiv);
        });
    }

    function openLightbox(index) {
        currentIndex = index;
        isZoomed = false;
        updateLightbox();
        document.getElementById('custom-lightbox').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('custom-lightbox').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function updateLightbox() {
        const wrapper = document.getElementById('lightbox-wrapper');
        document.getElementById('custom-lightbox-img').src = galleryData[currentIndex].src;
        wrapper.style.transform = 'scale(1)';
        isZoomed = false;
    }

    function changeImage(direction, event) {
        if (event) event.stopPropagation();
        currentIndex += direction;
        if (currentIndex >= galleryData.length) currentIndex = 0; 
        if (currentIndex < 0) currentIndex = galleryData.length - 1; 
        updateLightbox();
    }

    function toggleZoom(event) {
        if (event) event.stopPropagation();
        const wrapper = document.getElementById('lightbox-wrapper');
        const lightbox = document.getElementById('custom-lightbox');
        if (!isZoomed) {
            wrapper.style.transform = 'scale(1.4)'; 
            lightbox.style.overflow = 'auto'; 
            isZoomed = true;
        } else {
            wrapper.style.transform = 'scale(1)';
            lightbox.style.overflow = 'hidden';
            isZoomed = false;
        }
    }

    document.addEventListener('keydown', function(e) {
        if (document.getElementById('custom-lightbox').style.display === 'flex') {
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'Escape') closeLightbox();
        }
    });

    document.getElementById('custom-lightbox').addEventListener('click', function(e) {
        if (e.target === this || e.target === document.getElementById('lightbox-wrapper')) {
            closeLightbox();
        }
    });

    initGallery();
</script>

</body>
