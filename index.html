<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyeryung Kim | Portfolio</title>
    
    <!-- 🌐 Noto Serif Oriya 공식 구글 주소 연동 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Serif+Oriya:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
    margin: 0 !important;
    padding: 0 !important;
    overflow-x: hidden !important;
    overflow-y: auto !important; /* 내부 내용에 따라 부드럽게 연동 */
}

/* 브라우저 및 구글 프레임의 우측 기본 스크롤바 자체를 투명하게 숨기는 마법의 코드 */
::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
}
        /* 첫 화면 사진 목록 정렬 (3열 바둑판 고정) */
        .gallery {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 40px !important;
            max-width: 1000px !important;
            margin: 0 auto !important;
            padding: 20px 0 !important;
        }

        @media (max-width: 768px) {
            .gallery { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)) !important; }
        }

        /* 개별 사진+텍스트 카드 세트 */
        .gallery-container {
            display: none; 
            flex-direction: column !important;
            align-items: center !important;
            text-align: center !important;
        }

        /* 1. 작품 제목(Title) 디자인 */
        .item-title { 
            font-family: "Noto Serif", serif !important; 
            color: #4a4949 !important; 
            text-align: center !important;
            letter-spacing: 0.5px !important; 
            margin: 0 0 6px 0 !important; 
            font-size: 13px !important;    
            font-weight: 700 !important;   
        }
        
        /* 2. 작품 설명 및 사이즈(Description) 디자인 */
        .item-desc { 
            font-family: "Noto Serif", serif !important; 
            color: #4a4949 !important;     
            text-align: center !important;
            line-height: 1.5 !important; 
            margin: 0 !important; 
            white-space: pre-line !important; 
            font-size: 11px !important;    
            font-weight: 600 !important;   
        }

        /* 더보기 버튼 디자인 */
        .more-btn-container {
            text-align: center;
            margin: 50px 0 80px 0;
            width: 100%;
        }
        .more-btn {
            background: transparent;
            border: 1px solid #4a4949;
            color: #4a4949;
            padding: 12px 40px;
            font-size: 13px;
            font-family: "Noto Serif Oriya", serif;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .more-btn:hover {
            background-color: #4a4949;
            color: #ffffff;
        }

        .gallery-item {
            cursor: pointer !important;
            width: 280px !important;
            height: 280px !important;
            overflow: hidden !important;
            border-radius: 0px !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06) !important;
            transition: transform 0.2s ease;
            margin-bottom: 15px !important;
        }
        .gallery-item:hover { transform: translateY(-4px) !important; }
        .gallery-item img { width: 100% !important; height: 100% !important; object-fit: cover !important; display: block !important; }

        /* 🖤 모서리 완벽한 직각 및 아담한 크기의 팝업창 박스 */
        .custom-lightbox { 
            display: none; 
            position: fixed !important; 
            top: 50% !important; 
            left: 50% !important; 
            transform: translate(-50%, -50%) !important; 
            
            width: 90vw !important; 
            height: 85vh !important; 
            max-width: 1000px !important;  
            max-height: 800px !important; 
            
            background-color: rgba(0, 0, 0, 0.98) !important; 
            z-index: 999999 !important; 
            justify-content: center !important; 
            align-items: center !important; 
            user-select: none !important;
            border-radius: 0px !important; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6) !important;
            overflow: hidden !important;   
        }

        /* 🖼️ 사진 액자 공간 */
        .lightbox-wrapper { 
            position: relative !important; 
            width: 90% !important;
            height: 90% !important;
            max-width: 90% !important;
            max-height: 90% !important;
            display: flex !important; 
            justify-content: center !important; 
            align-items: center !important; 
            transition: transform 0.2s ease-in-out !important; 
        }

        /* 사진 위에 마우스를 대면 돋보기 모양 커서 생성 */
        .custom-lightbox img { 
            max-width: 100% !important; 
            max-height: 100% !important; 
            width: auto !important; 
            height: auto !important; 
            object-fit: contain !important; 
            display: block !important; 
            margin: auto !important;
            cursor: zoom-in !important; 
        }
        
        /* 이미 확대가 되었을 때는 축소 커서로 자동 변경 */
        .custom-lightbox.zoomed-mode img {
            cursor: zoom-out !important; 
        }

        /* 🔍 상단 우측 툴바 (오직 깔끔한 X 닫기 버튼만 배치) */
        .lightbox-toolbar { 
            position: absolute !important; 
            top: 20px !important; 
            right: 25px !important; 
            z-index: 100002 !important; 
        }

        .toolbar-btn { 
            color: #ffffff !important; 
            font-size: 32px !important; 
            cursor: pointer !important; 
            opacity: 0.6 !important; 
            transition: opacity 0.2s !important; 
        }
        .toolbar-btn:hover { opacity: 1 !important; }

        /* ◀ ▶ 이동 화살표 버튼 */
        .nav-btn { 
            position: absolute !important; 
            top: 50% !important; 
            transform: translateY(-50%) !important; 
            cursor: pointer !important; 
            width: 40px !important; 
            height: 60px !important; 
            display: flex !important; 
            align-items: center !important; 
            justify-content: center !important; 
            opacity: 0.5 !important; 
            z-index: 1000001 !important; 
            background-color: transparent !important; 
            border: none !important; 
            transition: opacity 0.2s ease !important; 
        }
        .nav-btn:hover { opacity: 1 !important; }
        .prev-btn { left: 15px !important; }  
        .next-btn { right: 15px !important; } 
        .nav-icon { width: 32px; height: 32px; stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

<!-- 🖼️ 갤러리 메인 영역 -->
<div id="gallery" class="gallery"></div>

<!-- ➕ MORE 버튼 영역 -->
<div id="more-btn-area" class="more-btn-container">
    <button class="more-btn" onclick="showNextImages()">More</button>
</div>

<!-- 🖤 아담하게 크기가 묶인 팝업창 영역 -->
<div id="custom-lightbox" class="custom-lightbox">
    <div class="lightbox-toolbar">
        <span class="toolbar-btn" onclick="closeLightbox()" title="닫기">&times;</span>
    </div>

    <span class="nav-btn prev-btn" onclick="changeImage(-1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </span>

    <span class="nav-btn next-btn" onclick="changeImage(1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </span>

    <div id="lightbox-wrapper" class="lightbox-wrapper">
        <img id="custom-lightbox-img" src="" alt="확대 사진" onclick="toggleZoom(event)">
    </div>
</div>

<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // 팝업창 내부의 이미지 요소를 선택합니다. (본인의 HTML 구조에 맞게 클래스나 ID를 수정하세요)
  // 예: 팝업창 ID가 #imagePopup이고 그 안의 이미지라면 '#imagePopup img'
  const popupImage = document.querySelector('.popup-content img') || document.querySelector('#popup img');

  if (!popupImage) return;

  // 초기 상태 설정
  let isZoomed = false;
  popupImage.style.cursor = 'zoom-in';
  popupImage.style.transition = 'transform 0.2s ease';

  // Alt 키 누름 감지하여 돋보기 모양 변경 (+ -> -)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Alt') {
      e.preventDefault(); // 브라우저 기본 메뉴 바인딩 방지
      popupImage.style.cursor = isZoomed ? 'zoom-out' : 'zoom-in';
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'Alt') {
      popupImage.style.cursor = isZoomed ? 'zoom-out' : 'zoom-in';
    }
  });

  // 클릭 이벤트 처리
  popupImage.addEventListener('click', (e) => {
    // 1. Alt 키를 누른 상태에서 클릭했을 때 (축소 기능)
    if (e.altKey) {
      if (isZoomed) {
        popupImage.style.transform = 'scale(1)';
        popupImage.style.cursor = 'zoom-in';
        isZoomed = false;
      }
    } 
    // 2. 그냥 클릭했을 때 (확대 기능)
    else {
      if (!isZoomed) {
        popupImage.style.transform = 'scale(2)'; // 원하는 확대 배율로 조절 가능 (예: 1.5, 2, 2.5)
        popupImage.style.cursor = 'zoom-out';
        isZoomed = true;
      }
    }
  });
});
</script>

</body>
</html>
