<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyeryung Kim | Portfolio</title>
    
    <!-- 🌐 Noto Serif Oriya 공식 구글 주소 연동 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Serif+Oriya:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        /* 브라우저 및 구글 프레임의 우측 기본 스크롤바 투명 가드 */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
        }
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
        }

        /* 첫 화면 사진 목록 정렬 (3열 바둑판 고정) */
        .gallery {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 40px !important;
            max-width: 1000px !important;
            margin: 0 auto !important;
            padding: 20px 0 !important;
        }

        @media (max-width: 768px) {
            .gallery { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)) !important; }
        }

        /* 개별 사진+텍스트 카드 세트 */
        .gallery-container {
            display: none; 
            flex-direction: column !important;
            align-items: center !important;
            text-align: center !important;
        }

        /* 1. 작품 제목(Title) 디자인 */
        .item-title { 
            font-family: "Noto Serif", serif !important; 
            color: #4a4949 !important; 
            text-align: center !important;
            letter-spacing: 0.5px !important; 
            margin: 0 0 6px 0 !important; 
            font-size: 14px !important;    
            font-weight: 600 !important;   
        }
        
        /* 2. 작품 설명 및 사이즈(Description) 디자인 */
        .item-desc { 
            font-family: "Noto Serif", serif !important; 
            color: #4a4949 !important;     
            text-align: center !important;
            line-height: 1.5 !important; 
            margin: 0 !important; 
            white-space: pre-line !important; 
            font-size: 11px !important;    
            font-weight: 600 !important;   
        }

        /* 더보기 버튼 디자인 */
        .more-btn-container {
            text-align: center;
            margin: 50px 0 80px 0;
            width: 100%;
        }
        .more-btn {
            background: transparent;
            border: 1px solid #4a4949;
            color: #4a4949;
            padding: 12px 40px;
            font-size: 13px;
            font-family: "Noto Serif Oriya", serif;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .more-btn:hover {
            background-color: #4a4949;
            color: #ffffff;
        }

        /* 첫 화면 사진 테두리 직각 고정 */
        .gallery-item {
            cursor: pointer !important;
            width: 280px !important;
            height: 280px !important;
            overflow: hidden !important;
            border-radius: 0px !important; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06) !important;
            transition: transform 0.2s ease;
            margin-bottom: 15px !important;
        }
        .gallery-item:hover { transform: translateY(-4px) !important; }
        .gallery-item img { width: 100% !important; height: 100% !important; object-fit: cover !important; display: block !important; }

        /* 모서리 직각 및 대폭 확대된 팝업창 박스 고정 */
        .custom-lightbox { 
            display: none; 
            position: fixed !important; 
            top: 50% !important; 
            left: 50% !important; 
            transform: translate(-50%, -50%) !important; 
            
            width: 90vw !important; 
            height: 85vh !important; 
            max-width: 1000px !important;  
            max-height: 800px !important; 
            
            background-color: rgba(0, 0, 0, 0.98) !important; 
            z-index: 999999 !important; 
            justify-content: center !important; 
            align-items: center !important; 
            border-radius: 0px !important; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6) !important;
            overflow: hidden !important;   
        }

        /* 사진 액자 공간 */
        .lightbox-wrapper { 
            position: relative !important; 
            width: 90% !important;
            height: 90% !important;
            max-width: 90% !important;
            max-height: 90% !important;
            display: flex !important; 
            justify-content: center !important; 
            align-items: center !important; 
            transition: transform 0.2s ease-in-out !important; 
        }

        .custom-lightbox img { 
            max-width: 100% !important; 
            max-height: 100% !important; 
            width: auto !important; 
            height: auto !important; 
            object-fit: contain !important; 
            display: block !important; 
            margin: auto !important;
        }

        /* 상단 우측 미니멀 툴바 배치실 */
        .lightbox-toolbar { 
            position: absolute !important; 
            top: 25px !important; 
            right: 35px !important; 
            display: flex !important;
            align-items: center !important;
            gap: 25px !important; 
            z-index: 100002 !important; 
            user-select: none !important;
        }

        .toolbar-btn { 
            color: #ffffff !important; 
            font-size: 32px !important; 
            cursor: pointer !important; 
            opacity: 0.5 !important; 
            transition: opacity 0.2s !important; 
        }
        .toolbar-btn:hover { opacity: 1 !important; }

        /* ◀ ▶ 이동 화살표 버튼 위치 및 크기 */
        .nav-btn { 
            position: absolute !important; 
            top: 50% !important; 
            transform: translateY(-50%) !important; 
            cursor: pointer !important; 
            width: 40px !important; 
            height: 60px !important; 
            display: flex !important; 
            align-items: center !important; 
            justify-content: center !important; 
            opacity: 0.3 !important; 
            z-index: 1000001 !important; 
            background-color: transparent !important; 
            border: none !important; 
            transition: opacity 0.2s ease !important; 
        }
        .nav-btn:hover { opacity: 1 !important; }
        .prev-btn { left: 15px !important; }  
        .next-btn { right: 15px !important; } 
        .nav-icon { width: 32px; height: 32px; stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

<!-- 🖼️ 갤러리 메인 영역 -->
<div id="gallery" class="gallery"></div>

<!-- ➕ MORE 버튼 영역 -->
<div id="more-btn-area" class="more-btn-container">
    <button class="more-btn" onclick="showNextImages()">More</button>
</div>

<!-- 🖤 완성형 팝업 제어 공간 -->
<div id="custom-lightbox" class="custom-lightbox">
    <div class="lightbox-toolbar">
        <span class="toolbar-btn" onclick="closeLightbox()" title="닫기">&times;</span>
    </div>

    <span class="nav-btn prev-btn" onclick="changeImage(-1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </span>

    <span class="nav-btn next-btn" onclick="changeImage(1, event)">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </span>

    <div id="lightbox-wrapper" class="lightbox-wrapper">
        <img id="custom-lightbox-img" src="" alt="확대 사진">
    </div>
</div>

<script src="script.js"></script>
<script>
    let currentIndex = 0;
    let isZoomed = false;
    
    const IMAGES_PER_PAGE = 9; 
    let visibleCount = IMAGES_PER_PAGE;

    // 🎹 스페이스바 상태 실시간 감지 변수
    let isSpacePressed = false;

    // 🖱️ 드래그 앤 팬 이동 관련 변수들
    let isDragging = false;
    let startX, startY, scrollLeft, scrollTop;
    const lightbox = document.getElementById('custom-lightbox');
    const wrapper = document.getElementById('lightbox-wrapper');
    const lightboxImg = document.getElementById('custom-lightbox-img');

    // 첫 화면 바둑판 그리기 빌드업 함수
    function initGallery() {
        const galleryContainer = document.getElementById('gallery');
        galleryContainer.innerHTML = '';

        if (!galleryData || galleryData.length === 0) {
            galleryContainer.innerHTML = '<div style="color:#aaa; text-align:center; margin-top:50px;">등록된 사진이 없습니다.</div>';
            document.getElementById('more-btn-area').style.display = 'none';
            return;
        }

        galleryData.forEach((item, index) => {
            const containerDiv = document.createElement('div');
            containerDiv.className = 'gallery-container';
            containerDiv.id = `item-container-${index}`;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'gallery-item';
            itemDiv.setAttribute('onclick', `openLightbox(${index})`);
            
            const imgTag = document.createElement('img');
            imgTag.src = item.src;
            imgTag.alt = item.title;
            
            itemDiv.appendChild(imgTag);
            containerDiv.appendChild(itemDiv);

            const titleH3 = document.createElement('h3');
            titleH3.className = 'item-title';
            titleH3.innerText = item.title;
            containerDiv.appendChild(titleH3);

            const descP = document.createElement('p');
            descP.className = 'item-desc';
            descP.innerText = item.desc;
            containerDiv.appendChild(descP);

            galleryContainer.appendChild(containerDiv);
        });

        updateVisibility();
    }

    function updateVisibility() {
        galleryData.forEach((item, index) => {
            const targetElement = document.getElementById(`item-container-${index}`);
            if (targetElement) {
                if (index < visibleCount) {
                    targetElement.style.display = 'flex';
                } else {
                    targetElement.style.display = 'none';
                }
            }
        });

        const moreBtnArea = document.getElementById('more-btn-area');
        if (visibleCount >= galleryData.length) {
            moreBtnArea.style.display = 'none';
        } else {
            moreBtnArea.style.display = 'block';
        }
    }

    function showNextImages() {
        visibleCount += IMAGES_PER_PAGE;
        updateVisibility();
    }

    function openLightbox(index) {
        currentIndex = index;
        isZoomed = false;
        updateLightbox();
        lightbox.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.style.display = 'none';
        document.body.style.overflow = 'auto';
        isSpacePressed = false;
        isDragging = false;
        updateCursorStatus();
    }

    function updateLightbox() {
        lightboxImg.src = galleryData[currentIndex].src;
        wrapper.style.transform = 'scale(1)';
        lightbox.style.overflow = 'hidden'; 
        isZoomed = false;
        updateCursorStatus(); 
    }

    function changeImage(direction, event) {
        if (event) event.stopPropagation();
        currentIndex += direction;
        if (currentIndex >= galleryData.length) currentIndex = 0; 
        if (currentIndex < 0) currentIndex = galleryData.length - 1; 
        updateLightbox();
    }

    // 🔍 실시간 마우스 커서 상태 조립 장치
    function updateCursorStatus() {
        if (lightbox.style.display !== 'flex') return;
        
        if (isSpacePressed && isZoomed) {
            // ✋ 스페이스바를 누르고 사진이 확대된 상태일 때만 손바닥 모양 활성화
            lightbox.style.cursor = isDragging ? 'grabbing' : 'grab';
            lightboxImg.style.cursor = isDragging ? 'grabbing' : 'grab';
        } else {
            // 그 외 일반 상태일 때는 확대/축소 돋보기 커서로 자동 스위칭
            lightbox.style.cursor = 'default';
            lightboxImg.style.cursor = isZoomed ? 'zoom-out' : 'zoom-in';
        }
    }

    // 🎹 키보드를 누르는 순간 감지 엔진 (스페이스바)
    document.addEventListener('keydown', function(e) {
        if (lightbox.style.display !== 'flex') return;

        if (e.code === 'Space') {
            isSpacePressed = true;
            e.preventDefault(); // 스페이스바 눌렀을 때 구글/브라우저 화면이 아래로 출렁이는 기본 스크롤 방지
            updateCursorStatus();
        }
        
        if (e.key === 'ArrowRight') changeImage(1);
        if (e.key === 'ArrowLeft') changeImage(-1);
        if (e.key === 'Escape') closeLightbox();
    });

    // 🎹 키보드에서 손을 떼는 순간 감지 엔진
    document.addEventListener('keyup', function(e) {
        if (e.code === 'Space') { 
            isSpacePressed = false; 
            isDragging = false;
            updateCursorStatus(); 
        }
    });

    // 🖱️ 큰 사진 '클릭' 이벤트 제어기 (토글 방식 완벽 유지)
    lightboxImg.addEventListener('click', (e) => {
        e.stopPropagation(); // 배경 클릭 꺼짐 방지 가드

        // 💡 [핵심] 스페이스바를 누르고 드래그 조종 중일 때는 클릭 토글이 작동하지 않도록 방어막 탑재
        if (isSpacePressed) return;

        if (isZoomed) {
            // 1. 이미 확대된 상태라면? ➡️ 그냥 클릭 시 원래대로 '축소'
            wrapper.style.transform = 'scale(1)';
            lightbox.style.overflow = 'hidden';
            isZoomed = false;
            updateCursorStatus();
        } else {
            // 2. 축소된 상태라면? ➡️ 그냥 클릭 시 300% 대형 '확대'
            wrapper.style.transform = 'scale(3.0)';
            lightbox.style.overflow = 'auto';
            isZoomed = true;
            updateCursorStatus();
        }
    });

    // ❌ 사진 밖 검은색 뒷배경 여백을 클릭하면 창 닫기
    lightbox.addEventListener('click', function(e) {
        if (e.target === this || e.target === wrapper) {
            closeLightbox();
        }
    });

    // ✋ [스페이스바용] 마우스 드래그 앤 팬 시스템 기동 실시간 엔진
    lightbox.addEventListener('mousedown', (e) => {
        if (!isSpacePressed || !isZoomed) return; // 스페이스바를 누르고 사진이 확정 확대 상태일 때만 드래그 허용
        isDragging = true;
        updateCursorStatus();
        startX = e.pageX - lightbox.offsetLeft;
        startY = e.pageY - lightbox.offsetTop;
        scrollLeft = lightbox.scrollLeft;
        scrollTop = lightbox.scrollTop;
        e.preventDefault(); // 사진이 브라우저 기본 이미지 복사 찌꺼기로 드래그되는 현상 차단
    });

    lightbox.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - lightbox.offsetLeft;
        const y = e.pageY - lightbox.offsetTop;
        const walkX = (x - startX) * 1.5; // 마우스 이동 감도 세팅 (1.5배 부드럽게)
        const walkY = (y - startY) * 1.5;
        lightbox.scrollLeft = scrollLeft - walkX;
        lightbox.scrollTop = scrollTop - walkY;
    });

    lightbox.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; updateCursorStatus(); } });
    lightbox.addEventListener('mouseleave', () => { if (isDragging) { isDragging = false; updateCursorStatus(); } });

    // 안전 모바일 터치 트래킹 시스템 가드 내장
    lightbox.addEventListener('touchstart', (e) => {
        if (!isZoomed) return;
        isDragging = true;
        startX = e.touches[0].pageX - lightbox.offsetLeft;
        startY = e.touches[0].pageY - lightbox.offsetTop;
        scrollLeft = lightbox.scrollLeft;
        scrollTop = lightbox.scrollTop;
    }, { passive: true });
    lightbox.addEventListener('touchend', () => { isDragging = false; });
    lightbox.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const x = e.touches[0].pageX - lightbox.offsetLeft;
        const y = e.touches[0].pageY - lightbox.offsetTop;
        lightbox.scrollLeft = scrollLeft - (x - startX) * 1.5;
        lightbox.scrollTop = scrollTop - (y - startY) * 1.5;
    }, { passive: true });

    // 브라우저 탭 이탈 방지 가드 (창 밖으로 튕겼을 때 스페이스바 먹통 버그 케어)
    window.addEventListener('blur', () => { isSpacePressed = false; updateCursorStatus(); });

    initGallery();
</script>

</body>
</html>
